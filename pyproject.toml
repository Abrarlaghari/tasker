[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tasker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "ruff",
  "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tasker"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["src"]
